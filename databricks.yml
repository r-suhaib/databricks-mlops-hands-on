bundle:
  name: databricks-mlops-hands-on

variables:

  catalog:
    default: tep_anomaly

  schema:
    default: served

include:
  - resources/*.yml
  - resources/jobs/*.yml

targets:

  dev:
    default: true

    variables:
      environment: dev

  test:

    variables:
      environment: test

  prod:

    variables:
      environment: prod