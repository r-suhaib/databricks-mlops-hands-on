name: Bundle Validation

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Bundle Structure
        run: |
          test -f databricks.yml
          echo "Bundle file found"

      - name: Validate Resource Directory
        run: |
          test -d resources/jobs
          echo "Resource directory found"

      - name: Validate Model Configurations
        run: |
          test -d conf/models
          echo "Model configs found"

      - name: Validate Environment Configurations
        run: |
          test -d conf/environments
          echo "Environment configs found"
      
      - name: Validate Documentation
        run: |
          test -d docs
          echo "Documentation found"
      
      - name: Validate Source Directory
        run: |
          test -d src
          echo "Source directory found" 

      - name: Validate Pipelines
        run: |
          test -d pipelines
          echo "Pipelines found"

      - name: Validate Monitoring Components
        run: |
          test -d src/monitoring
          echo "Monitoring components found"
      
      - name: Validate Evaluation Components
        run: |
          test -d src/evaluation
          echo "Evaluation components found"
        

        
      