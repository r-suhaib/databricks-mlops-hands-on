name: Deploy DEV

on:
  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Bundle Exists
        run: |
          test -f databricks.yml
          echo "Bundle file found"

      - name: Simulated Bundle Validation
        run: |
          echo "databricks bundle validate"

      - name: Simulated DEV Deployment
        run: |
          echo "databricks bundle deploy --target dev"